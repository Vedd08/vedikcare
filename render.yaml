services:
  - type: web
    name: vedikcare-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false       # Set this manually in Render dashboard (Atlas URI)
      - key: JWT_SECRET
        sync: false       # Set this manually in Render dashboard
      - key: CORS_ORIGIN
        sync: false       # Set to your Vercel URL after deploying frontend
